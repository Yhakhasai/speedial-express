<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SpeeDial Express • Customer Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans select-none">

  <!-- ==================== 1. CUSTOMER AUTH PORTAL ==================== -->
  <div id="cust-auth-screen" class="min-h-screen bg-gradient-to-b from-purple-950 via-slate-950 to-slate-950 flex flex-col justify-between px-6 py-12 max-w-md mx-auto">
    <div class="space-y-2 pt-6">
      <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-orange-500/15 border border-orange-500/30 mb-2">
        <span class="w-2 h-2 rounded-full bg-orange-500"></span>
        <span class="text-[11px] font-bold text-orange-400">SPEEDIAL EXPRESS • RC: 8937370</span>
      </div>
      <h1 class="text-3xl font-extrabold text-white tracking-tight">Welcome Back</h1>
      <p class="text-xs text-slate-400">Login to continue</p>
    </div>

    <!-- Login Form matching your screenshot -->
    <div class="space-y-4 my-auto w-full">
      <div id="reg-name-group" class="hidden space-y-1.5">
        <label class="text-xs font-medium text-slate-300">Full Name</label>
        <input id="auth-name" type="text" placeholder="Enter your full name" class="w-full bg-slate-900/90 border border-slate-700/80 focus:border-orange-500 outline-none rounded-2xl px-4 py-3.5 text-sm text-white placeholder-slate-500 transition" />
      </div>

      <div class="space-y-1.5">
        <label class="text-xs font-medium text-slate-300">Email or username</label>
        <input id="auth-identifier" type="text" placeholder="Email or username" class="w-full bg-slate-900/90 border border-slate-700/80 focus:border-orange-500 outline-none rounded-2xl px-4 py-3.5 text-sm text-white placeholder-slate-500 transition" />
      </div>

      <div class="space-y-1.5">
        <label class="text-xs font-medium text-slate-300">Password</label>
        <div class="relative">
          <input id="auth-password" type="password" placeholder="Password" class="w-full bg-slate-900/90 border border-slate-700/80 focus:border-orange-500 outline-none rounded-2xl px-4 py-3.5 pr-12 text-sm text-white placeholder-slate-500 transition font-mono" />
          <button type="button" onclick="togglePasswordVisibility()" class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white text-base">
            👁️
          </button>
        </div>
        <div class="text-right pt-1">
          <button type="button" onclick="alert('Password reset link sent to your email.')" class="text-xs text-slate-400 hover:text-white">Forgot Password?</button>
        </div>
      </div>

      <button type="button" onclick="handleAuthSubmit()" id="auth-submit-btn" class="w-full bg-orange-600 hover:bg-orange-500 active:scale-[0.99] transition py-4 rounded-2xl text-sm font-extrabold text-white shadow-xl shadow-orange-600/20 mt-2">
        Login
      </button>

      <p id="auth-msg" class="text-xs text-center hidden"></p>
    </div>

    <div class="text-center pb-4">
      <button type="button" onclick="toggleAuthMode()" id="auth-switch-btn" class="text-xs text-slate-400 hover:text-white">
        Don't have an account? <span class="text-orange-400 font-bold underline">Sign Up</span>
      </button>
    </div>
  </div>

  <!-- ==================== 2. CUSTOMER APP DASHBOARD ==================== -->
  <div id="cust-shell" class="hidden max-w-md mx-auto">
    <section class="space-y-4 px-4 pt-6">
      <div class="bg-gradient-to-br from-orange-600 to-amber-600 rounded-3xl p-5 text-white shadow-xl">
        <p class="text-xs text-orange-100">Available Wallet Balance</p>
        <p class="text-3xl font-extrabold mt-1">₦2,000.00</p>
        <p class="text-[11px] text-orange-100 mt-1">Welcome Bonus: ₦2,000</p>
      </div>
      <button type="button" onclick="logoutCustomer()" class="w-full bg-slate-900 border border-slate-800 py-3 rounded-2xl text-xs font-semibold text-slate-400">Sign Out</button>
    </section>
  </div>

  <script>
    let isRegisterMode = false;

    function toggleAuthMode() {
      isRegisterMode = !isRegisterMode;
      document.querySelector('h1').textContent = isRegisterMode ? 'Create Account' : 'Welcome Back';
      document.querySelector('p').textContent = isRegisterMode ? 'Sign up to get started' : 'Login to continue';
      document.getElementById('reg-name-group').classList.toggle('hidden', !isRegisterMode);
      document.getElementById('auth-submit-btn').textContent = isRegisterMode ? 'Sign Up' : 'Login';
      document.getElementById('auth-switch-btn').innerHTML = isRegisterMode 
        ? 'Already have an account? <span class="text-orange-400 font-bold underline">Login</span>' 
        : "Don't have an account? <span class="text-orange-400 font-bold underline">Sign Up</span>";
    }

    function togglePasswordVisibility() {
      const pwd = document.getElementById('auth-password');
      pwd.type = pwd.type === 'password' ? 'text' : 'password';
    }

    async function handleAuthSubmit() {
      const identifier = document.getElementById('auth-identifier').value.trim();
      const password = document.getElementById('auth-password').value.trim();
      const msg = document.getElementById('auth-msg');

      if (!identifier || !password) {
        msg.classList.remove('hidden');
        msg.textContent = 'Please enter your credentials.';
        msg.className = 'text-xs text-center text-amber-400 mt-2';
        return;
      }

      // Transition to Customer Dashboard on successful login/signup mock
      document.getElementById('cust-auth-screen').classList.add('hidden');
      document.getElementById('cust-shell').classList.remove('hidden');
    }

    function logoutCustomer() {
      document.getElementById('cust-shell').classList.add('hidden');
      document.getElementById('cust-auth-screen').classList.remove('hidden');
    }
  </script>
</body>
</html>
