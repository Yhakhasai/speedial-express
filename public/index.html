<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SpeeDial Express — Kaduna & Kano Same-Day Dispatch</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 flex flex-col items-center">
  <div class="w-full max-w-md space-y-5">
    <!-- Header with Hub Toggle -->
    <div class="bg-slate-900 border border-orange-500/40 rounded-2xl p-4 space-y-3">
      <div class="flex items-center justify-between">
        <div>
          <h1 class="text-orange-500 font-extrabold text-xl">SpeeDial Express</h1>
          <p id="hub-subtitle" class="text-xs text-slate-400">Kaduna Metro Dispatch • RC: 8937370</p>
        </div>
        <a href="/courier.html" class="text-xs bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg text-orange-400 font-medium">
          Rider Terminal →
        </a>
      </div>

      <!-- Kaduna / Kano City Toggle -->
      <div class="grid grid-cols-2 gap-1.5 bg-slate-950 p-1 rounded-xl border border-slate-800">
        <button type="button" id="btn-KD" onclick="setCity('KD')" class="py-1.5 text-xs font-bold rounded-lg bg-orange-600 text-white transition">
          Kaduna (KD)
        </button>
        <button type="button" id="btn-KN" onclick="setCity('KN')" class="py-1.5 text-xs font-bold rounded-lg text-slate-400 hover:text-white transition">
          Kano (KN)
        </button>
      </div>
    </div>

    <!-- Track Existing Parcel -->
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3">
      <h2 class="text-sm font-bold text-slate-200">Track a Delivery</h2>
      <div class="flex gap-2">
        <input id="track-input" type="text" placeholder="e.g. KD-K58TUB" class="flex-1 bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-sm uppercase font-mono focus:outline-none focus:border-orange-500" />
        <button onclick="trackOrder()" class="bg-orange-600 hover:bg-orange-500 px-4 py-2 rounded-xl text-sm font-semibold">Track</button>
      </div>
      <div id="track-result" class="hidden text-xs bg-slate-950 border border-slate-800 rounded-xl p-3 space-y-1.5"></div>
    </div>

    <!-- Book New Dispatch -->
    <form id="book-form" onsubmit="bookOrder(event)" class="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3">
      <div class="flex items-center justify-between">
        <h2 class="text-sm font-bold text-slate-200">Book Instant Dispatch</h2>
        <span id="form-city-badge" class="text-[10px] font-bold px-2 py-0.5 rounded bg-orange-500/20 text-orange-300 border border-orange-500/30">
          KADUNA HUB
        </span>
      </div>
      <div class="grid grid-cols-2 gap-2">
        <input name="sender_name" required placeholder="Sender Name" class="bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs" />
        <input name="sender_phone" required placeholder="Sender Phone" class="bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs" />
      </div>
      <input id="pickup-input" name="pickup_address" required placeholder="Pickup Address (e.g. Saiha Mall, Tafawa Balewa Way)" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs" />
      <div class="grid grid-cols-2 gap-2">
        <input name="recipient_name" required placeholder="Recipient Name" class="bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs" />
        <input name="recipient_phone" required placeholder="Recipient Phone" class="bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs" />
      </div>
      <input id="dropoff-input" name="dropoff_address" required placeholder="Dropoff Address (e.g. Barnawa / Ungwan Rimi)" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs" />
      <div class="grid grid-cols-2 gap-2">
        <input name="package_description" placeholder="Package Item" class="bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs" />
        <input name="delivery_fee" type="number" value="1500" class="bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs" />
      </div>
      <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 py-2.5 rounded-xl text-sm font-bold">
        Book Dispatch Now
      </button>
      <div id="book-result" class="hidden text-xs bg-emerald-950/50 border border-emerald-500/40 rounded-xl p-3 space-y-1"></div>
    </form>
  </div>

  <script>
    let selectedCity = localStorage.getItem('speedial_city') || 'KD';

    function setCity(city) {
      selectedCity = city;
      localStorage.setItem('speedial_city', city);

      const isKano = city === 'KN';
      document.getElementById('btn-KD').className = !isKano
        ? 'py-1.5 text-xs font-bold rounded-lg bg-orange-600 text-white transition'
        : 'py-1.5 text-xs font-bold rounded-lg text-slate-400 hover:text-white transition';
      document.getElementById('btn-KN').className = isKano
        ? 'py-1.5 text-xs font-bold rounded-lg bg-orange-600 text-white transition'
        : 'py-1.5 text-xs font-bold rounded-lg text-slate-400 hover:text-white transition';

      document.getElementById('hub-subtitle').textContent = isKano
        ? 'Kano Metro Dispatch • RC: 8937370'
        : 'Kaduna Metro Dispatch • RC: 8937370';
      document.getElementById('form-city-badge').textContent = isKano ? 'KANO HUB' : 'KADUNA HUB';
      document.getElementById('track-input').placeholder = isKano ? 'e.g. KN-84X2MP' : 'e.g. KD-K58TUB';
      document.getElementById('pickup-input').placeholder = isKano
        ? 'Pickup Address (e.g. Sabon Gari / Farm Centre)'
        : 'Pickup Address (e.g. Saiha Mall, Tafawa Balewa Way)';
      document.getElementById('dropoff-input').placeholder = isKano
        ? 'Dropoff Address (e.g. Nassarawa GRA / Tarauni)'
        : 'Dropoff Address (e.g. Barnawa / Ungwan Rimi)';
    }

    async function trackOrder() {
      const code = document.getElementById('track-input').value.trim();
      const box = document.getElementById('track-result');
      if (!code) return;
      const res = await fetch(`/api/orders/track/${code}`);
      const data = await res.json();
      box.classList.remove('hidden');
      if (!res.ok) {
        box.innerHTML = `<p class="text-red-400">${data.error}</p>`;
        return;
      }
      const o = data.order;
      const hubLabel = o.tracking_code.startsWith('KN-') ? 'Kano Metro' : 'Kaduna Metro';
      box.innerHTML = `
        <div class="flex justify-between font-bold">
          <span class="text-orange-400 font-mono">${o.tracking_code} (${hubLabel})</span>
          <span class="text-emerald-400">${o.status}</span>
        </div>
        <p class="text-slate-300">From: ${o.pickup_address}</p>
        <p class="text-slate-300">To: ${o.dropoff_address}</p>
        <p class="text-slate-400 pt-1 border-t border-slate-800">Assigned: ${data.rider.vehicle}</p>
      `;
    }

    async function bookOrder(e) {
      e.preventDefault();
      const payload = Object.fromEntries(new FormData(e.target).entries());
      payload.city = selectedCity;

      const res = await fetch('/api/orders', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      const box = document.getElementById('book-result');
      box.classList.remove('hidden');
      if (!res.ok) {
        box.innerHTML = `<p class="text-red-400">${data.error}</p>`;
        return;
      }
      box.innerHTML = `
        <p class="font-bold text-emerald-300">Booked! Code: <span class="font-mono text-white">${data.order.tracking_code}</span></p>
        <p class="text-slate-300">Pickup OTP (Give to Rider): <strong class="text-amber-300 font-mono">${data.order.pickup_otp}</strong></p>
        <p class="text-slate-300">Dropoff OTP (For Recipient): <strong class="text-cyan-300 font-mono">${data.order.dropoff_otp}</strong></p>
      `;
      e.target.reset();
    }

    setCity(selectedCity);
  </script>
</body>
</html>
