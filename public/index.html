<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SpeeDial Express • Customer Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans pb-24 select-none">

  <!-- ==================== CUSTOMER APP SHELL ==================== -->
  <div id="cust-shell" class="max-w-md mx-auto">

    <!-- TAB 1: HOME -->
    <section id="cview-home" class="space-y-4">
      <div class="bg-gradient-to-br from-slate-900 via-slate-900 to-orange-950/40 border-b border-orange-500/20 rounded-b-3xl px-4 pt-5 pb-6 space-y-4 shadow-lg">
        <div class="flex items-center justify-between">
          <div>
            <h1 class="text-xl font-extrabold text-white">Hello, Usman 👋</h1>
            <p class="text-xs text-slate-400 mt-0.5">Customer Portal • RC: 8937370</p>
          </div>
        </div>
      </div>

      <div class="px-4 space-y-4">
        <!-- Wallet Hero Card -->
        <div class="bg-gradient-to-br from-orange-600 via-orange-600 to-amber-600 rounded-3xl p-5 text-white shadow-xl shadow-orange-600/20 relative overflow-hidden">
          <div class="flex items-center justify-between text-xs text-orange-100">
            <span>💳 Available for orders</span>
          </div>
          <div class="text-3xl font-extrabold tracking-tight mt-2">₦2,000.00</div>
          <div class="inline-block mt-2 px-3 py-1 rounded-full bg-black/20 text-[11px] font-semibold text-orange-50">
            Welcome Bonus: ₦2,000
          </div>
          <div class="grid grid-cols-2 gap-2.5 mt-4">
            <button type="button" onclick="openAddMoneyModal()" class="bg-white text-slate-950 font-bold text-xs py-3 rounded-2xl shadow">+ Fund wallet</button>
            <button type="button" onclick="openWithdrawModal()" class="bg-black/25 text-white font-bold text-xs py-3 rounded-2xl">↗ Withdraw</button>
          </div>
        </div>

        <button type="button" onclick="alert('Open Send Package flow')" class="w-full bg-slate-900 border border-orange-500/40 hover:border-orange-500 rounded-2xl p-4 flex items-center justify-between text-left shadow">
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-orange-600/20 text-orange-400 flex items-center justify-center text-lg">🚚</div>
            <div>
              <h2 class="text-sm font-extrabold text-white">Send a Package</h2>
              <p class="text-[11px] text-slate-400">Book an on-demand delivery rider now</p>
            </div>
          </div>
          <span class="text-orange-400 font-bold text-lg">›</span>
        </button>
      </div>
    </section>

    <!-- TAB 2: ORDERS -->
    <section id="cview-orders" class="hidden space-y-4 px-4 pt-5">
      <h1 class="text-xl font-extrabold text-white">My Orders</h1>
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-8 text-center text-xs text-slate-400">No active orders</div>
    </section>

    <!-- TAB 3: WALLET -->
    <section id="cview-wallet" class="hidden space-y-4 px-4 pt-5">
      <h1 class="text-xl font-extrabold text-white">Customer Wallet</h1>
      <div class="bg-gradient-to-br from-orange-600 to-amber-600 rounded-3xl p-5 text-white shadow-lg space-y-3">
        <p class="text-xs text-orange-100">Wallet Balance</p>
        <p class="text-3xl font-extrabold">₦2,000.00</p>
        <div class="flex gap-2 pt-2">
          <button type="button" onclick="openAddMoneyModal()" class="flex-1 bg-white text-slate-950 font-bold text-xs py-2.5 rounded-xl">+ Add money</button>
          <button type="button" onclick="openWithdrawModal()" class="flex-1 bg-black/25 text-white font-bold text-xs py-2.5 rounded-xl">Withdraw</button>
        </div>
      </div>
    </section>

    <!-- TAB 4: ALERTS -->
    <section id="cview-alerts" class="hidden space-y-4 px-4 pt-5">
      <h1 class="text-xl font-extrabold text-white">Notifications</h1>
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 text-xs text-slate-300">Welcome to SpeeDial Express! You have a ₦2,000 welcome bonus.</div>
    </section>

    <!-- TAB 5: PROFILE -->
    <section id="cview-profile" class="hidden space-y-4 px-4 pt-5 text-center">
      <div class="w-16 h-16 rounded-full bg-orange-600 mx-auto flex items-center justify-center text-xl font-extrabold text-white shadow-lg">US</div>
      <h2 class="text-base font-extrabold text-white">Usman (Customer)</h2>
      <button type="button" onclick="alert('Signed out')" class="w-full bg-slate-900 border border-slate-800 py-3 rounded-2xl text-xs font-semibold text-slate-400">Sign Out</button>
    </section>

    <!-- ADD MONEY MODAL -->
    <div id="add-money-modal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-end justify-center">
      <div class="bg-slate-900 border-t border-orange-500/40 rounded-t-3xl w-full max-w-md p-6 space-y-5">
        <div class="flex items-center justify-between">
          <h3 class="text-base font-extrabold text-white">Add Money</h3>
          <button type="button" onclick="closeAddMoneyModal()" class="w-8 h-8 rounded-full bg-slate-800 text-slate-300">✕</button>
        </div>
        <div class="space-y-3">
          <button type="button" onclick="alert('Paystack Online Checkout')" class="w-full text-left p-4 rounded-2xl bg-slate-950 border border-slate-800 hover:border-orange-500 flex items-center justify-between">
            <div><p class="text-xs font-extrabold text-white">Pay Online</p><p class="text-[11px] text-slate-400">Card, bank transfer via Paystack</p></div>
            <span>›</span>
          </button>
          <button type="button" onclick="alert('Wema Dedicated Account: 9819473522')" class="w-full text-left p-4 rounded-2xl bg-slate-950 border border-slate-800 hover:border-orange-500 flex items-center justify-between">
            <div><p class="text-xs font-extrabold text-white">Bank Transfer</p><p class="text-[11px] text-slate-400">Wema Bank • 9819473522</p></div>
            <span>›</span>
          </button>
        </div>
      </div>
    </div>

    <!-- WITHDRAW MODAL -->
    <div id="withdraw-modal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-end justify-center">
      <div class="bg-slate-900 border-t border-orange-500/40 rounded-t-3xl w-full max-w-md p-6 space-y-4">
        <div class="flex items-center justify-between">
          <h3 class="text-base font-extrabold text-white">Withdraw Cash</h3>
          <button type="button" onclick="closeWithdrawModal()" class="w-8 h-8 rounded-full bg-slate-800 text-slate-300">✕</button>
        </div>
        <input type="number" placeholder="Amount (₦)" class="w-full bg-slate-950 border border-slate-700 rounded-2xl px-4 py-3 text-sm text-white" />
        <button type="button" onclick="closeWithdrawModal()" class="w-full bg-orange-600 py-3.5 rounded-2xl text-xs font-extrabold text-white">Submit Withdrawal</button>
      </div>
    </div>

    <!-- NAVIGATION -->
    <nav class="fixed bottom-0 inset-x-0 z-40 bg-slate-900/95 backdrop-blur border-t border-slate-800">
      <div class="max-w-md mx-auto grid grid-cols-5 py-2">
        <button type="button" onclick="switchCustNav('home')" id="cnav-home" class="flex flex-col items-center gap-1 text-orange-400"><span class="text-[10px] font-bold">Home</span></button>
        <button type="button" onclick="switchCustNav('orders')" id="cnav-orders" class="flex flex-col items-center gap-1 text-slate-400"><span class="text-[10px]">Orders</span></button>
        <button type="button" onclick="switchCustNav('wallet')" id="cnav-wallet" class="flex flex-col items-center gap-1 text-slate-400"><span class="text-[10px]">Wallet</span></button>
        <button type="button" onclick="switchCustNav('alerts')" id="cnav-alerts" class="flex flex-col items-center gap-1 text-slate-400"><span class="text-[10px]">Alerts</span></button>
        <button type="button" onclick="switchCustNav('profile')" id="cnav-profile" class="flex flex-col items-center gap-1 text-slate-400"><span class="text-[10px]">Profile</span></button>
      </div>
    </nav>
  </div>

  <script>
    function switchCustNav(tab) {
      ['home', 'orders', 'wallet', 'alerts', 'profile'].forEach(id => {
        document.getElementById(`cview-${id}`).classList.toggle('hidden', id !== tab);
        document.getElementById(`cnav-${id}`).className = id === tab ? 'flex flex-col items-center gap-1 text-orange-400' : 'flex flex-col items-center gap-1 text-slate-400';
      });
    }
    function openAddMoneyModal() { document.getElementById('add-money-modal').classList.remove('hidden'); }
    function closeAddMoneyModal() { document.getElementById('add-money-modal').classList.add('hidden'); }
    function openWithdrawModal() { document.getElementById('withdraw-modal').classList.remove('hidden'); }
    function closeWithdrawModal() { document.getElementById('withdraw-modal').classList.add('hidden'); }
  </script>
</body>
</html>
