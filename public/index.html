<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SpeeDial Express • Customer Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans select-none pb-12">

  <!-- ==================== 1. AUTH PORTAL (LOGIN / SIGN UP) ==================== -->
  <div id="cust-auth-screen" class="min-h-screen bg-gradient-to-b from-purple-950 via-slate-950 to-slate-950 flex flex-col justify-center px-6 py-8 max-w-md mx-auto">
    
    <!-- Header Title -->
    <div class="mb-6">
      <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-orange-500/15 border border-orange-500/30 mb-3">
        <span class="w-2 h-2 rounded-full bg-orange-500"></span>
        <span class="text-[11px] font-bold text-orange-400">SPEEDIAL EXPRESS • RC: 8937370</span>
      </div>
      <h1 id="auth-main-title" class="text-3xl font-extrabold text-white tracking-tight">Welcome Back</h1>
      <p id="auth-main-sub" class="text-xs text-slate-400 mt-1">Login to continue</p>
    </div>

    <!-- LOGIN FORM -->
    <div id="login-form-box" class="space-y-4">
      <div class="space-y-1.5">
        <label class="text-xs font-semibold text-slate-300">Email or username</label>
        <input id="login-identifier" type="text" placeholder="Email or username" class="w-full bg-slate-900 border border-slate-700 focus:border-orange-500 outline-none rounded-2xl px-4 py-3.5 text-sm text-white placeholder-slate-500" />
      </div>

      <div class="space-y-1.5">
        <label class="text-xs font-semibold text-slate-300">Password</label>
        <div class="relative">
          <input id="login-password" type="password" placeholder="Password" class="w-full bg-slate-900 border border-slate-700 focus:border-orange-500 outline-none rounded-2xl px-4 py-3.5 pr-12 text-sm text-white placeholder-slate-500 font-mono" />
          <button type="button" onclick="toggleLoginPassword()" class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white">👁️</button>
        </div>
        <div class="text-right pt-1">
          <button type="button" onclick="alert('Password reset link sent.')" class="text-xs text-slate-400 hover:text-white">Forgot Password?</button>
        </div>
      </div>

      <button type="button" onclick="handleLogin()" class="w-full bg-orange-600 hover:bg-orange-500 active:scale-[0.99] transition py-4 rounded-2xl text-sm font-extrabold text-white shadow-xl shadow-orange-600/20 mt-2">
        Login
      </button>

      <div class="text-center pt-3">
        <button type="button" onclick="switchAuthView('REGISTER')" class="text-xs text-slate-400 hover:text-white">
          Don't have an account? <span class="text-orange-400 font-bold underline">Sign Up</span>
        </button>
      </div>
    </div>

    <!-- SIGN UP FORM (MATCHING YOUR SCREENSHOT EXACTLY) -->
    <div id="register-form-box" class="hidden space-y-3.5">
      <div class="space-y-1">
        <label class="text-xs font-semibold text-slate-300">Full Name</label>
        <input id="reg-fullname" type="text" placeholder="Enter your full name" class="w-full bg-slate-900 border border-slate-700 focus:border-orange-500 outline-none rounded-2xl px-4 py-3 text-sm text-white placeholder-slate-500" />
      </div>

      <div class="space-y-1">
        <label class="text-xs font-semibold text-slate-300">Email Address</label>
        <input id="reg-email" type="email" placeholder="Enter your email address" class="w-full bg-slate-900 border border-slate-700 focus:border-orange-500 outline-none rounded-2xl px-4 py-3 text-sm text-white placeholder-slate-500" />
      </div>

      <div class="space-y-1">
        <label class="text-xs font-semibold text-slate-300">Phone Number</label>
        <input id="reg-phone" type="tel" placeholder="e.g 09011223344 or +234901122..." class="w-full bg-slate-900 border border-slate-700 focus:border-orange-500 outline-none rounded-2xl px-4 py-3 text-sm text-white placeholder-slate-500"[cite: 13] />
      </div>

      <div class="space-y-1">
        <label class="text-xs font-semibold text-slate-300">Your state</label>
        <div class="relative">
          <select id="reg-state" class="w-full bg-slate-900 border border-slate-700 focus:border-orange-500 outline-none rounded-2xl px-4 py-3 text-sm text-slate-300 appearance-none">
            <option value="" disabled selected>Select a state</option>
            <option value="Kaduna">Kaduna State</option>
            <option value="Kano">Kano State</option>
            <option value="Lagos">Lagos State</option>
            <option value="Abuja">FCT Abuja</option>
          </select>
          <span class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none">⌄</span>
        </div>
        <p class="text-[11px] text-slate-400 px-1 pt-0.5">We show logistics partners in your state first. You can choose another when ordering.</p>
      </div>

      <div class="space-y-1">
        <label class="text-xs font-semibold text-slate-300">Password</label>
        <div class="relative">
          <input id="reg-password" type="password" placeholder="••••••••••••" class="w-full bg-slate-900 border border-slate-700 focus:border-orange-500 outline-none rounded-2xl px-4 py-3 pr-12 text-sm text-white placeholder-slate-500 font-mono" />
          <button type="button" onclick="toggleRegPassword()" class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white">👁️</button>
        </div>
      </div>

      <div class="space-y-1">
        <label class="text-xs font-semibold text-slate-300">Referral Code (optional)</label>
        <input id="reg-ref" type="text" placeholder="Enter a referral code" class="w-full bg-slate-900 border border-slate-700 focus:border-orange-500 outline-none rounded-2xl px-4 py-3 text-sm text-white placeholder-slate-500 uppercase font-mono" />
      </div>

      <!-- Terms Checkbox -->
      <div class="flex items-start gap-2.5 pt-1">
        <input id="reg-terms" type="checkbox" class="mt-0.5 rounded accent-orange-600 w-4 h-4" />
        <label for="reg-terms" class="text-xs text-slate-300 leading-snug">
          I agree to the <a href="#" class="text-orange-400 underline">Terms of Service</a> and <a href="#" class="text-orange-400 underline">Privacy Policy</a>[cite: 13]
        </label>
      </div>

      <button type="button" onclick="handleRegister()" class="w-full bg-orange-600 hover:bg-orange-500 active:scale-[0.99] transition py-3.5 rounded-2xl text-sm font-extrabold text-white shadow-xl shadow-orange-600/20 mt-1">
        Create Account
      </button>

      <div class="text-center pt-2">
        <button type="button" onclick="switchAuthView('LOGIN')" class="text-xs text-slate-400 hover:text-white">
          Already have an account? <span class="text-orange-400 font-bold underline">Login</span>
        </button>
      </div>
    </div>

    <p id="auth-msg" class="text-xs text-center hidden pt-2"></p>
  </div>

  <!-- ==================== 2. CUSTOMER APP DASHBOARD SHELL ==================== -->
  <div id="cust-shell" class="hidden max-w-md mx-auto">
    <section class="space-y-4 px-4 pt-6">
      <div class="bg-gradient-to-br from-orange-600 to-amber-600 rounded-3xl p-5 text-white shadow-xl">
        <p class="text-xs text-orange-100">Wallet Balance (Welcome Bonus)</p>
        <p class="text-3xl font-extrabold mt-1">₦2,000.00</p>
      </div>
      <button type="button" onclick="logoutCustomer()" class="w-full bg-slate-900 border border-slate-800 py-3 rounded-2xl text-xs font-semibold text-slate-400">Sign Out</button>
    </section>
  </div>

  <script>
    function switchAuthView(mode) {
      const isReg = mode === 'REGISTER';
      document.getElementById('login-form-box').classList.toggle('hidden', isReg);
      document.getElementById('register-form-box').classList.toggle('hidden', !isReg);
      document.getElementById('auth-main-title').textContent = isReg ? 'Create Account' : 'Welcome Back';
      document.getElementById('auth-main-sub').textContent = isReg ? 'Fill in your details to get started' : 'Login to continue';
      document.getElementById('auth-msg').classList.add('hidden');
    }

    function toggleLoginPassword() {
      const p = document.getElementById('login-password');
      p.type = p.type === 'password' ? 'text' : 'password';
    }

    function toggleRegPassword() {
      const p = document.getElementById('reg-password');
      p.type = p.type === 'password' ? 'text' : 'password';
    }

    function handleLogin() {
      document.getElementById('cust-auth-screen').classList.add('hidden');
      document.getElementById('cust-shell').classList.remove('hidden');
    }

    function handleRegister() {
      const terms = document.getElementById('reg-terms').checked;
      if (!terms) {
        alert('Please agree to the Terms of Service and Privacy Policy.');
        return;
      }
      document.getElementById('cust-auth-screen').classList.add('hidden');
      document.getElementById('cust-shell').classList.remove('hidden');
    }

    function logoutCustomer() {
      document.getElementById('cust-shell').classList.add('hidden');
      document.getElementById('cust-auth-screen').classList.remove('hidden');
    }
  </script>
</body>
</html>
