<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SpeeDial Express • Send It. Track It. Relax.</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    body { -webkit-tap-highlight-color: transparent; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .leaflet-control-attribution { font-size: 9px !important; background: rgba(15, 23, 42, 0.75) !important; color: #94a3b8 !important; }
    .leaflet-control-attribution a { color: #f97316 !important; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans pb-24 select-none">

  <!-- ==================== 1. ONBOARDING CAROUSEL ==================== -->
  <div id="onboarding-screen" class="hidden min-h-screen bg-gradient-to-b from-slate-900 via-slate-950 to-slate-950 flex flex-col justify-between px-6 py-8 max-w-md mx-auto">
    <div class="flex items-center justify-between">
      <span class="text-xs font-extrabold text-orange-400 tracking-wide">SpeeDial Express</span>
      <button type="button" onclick="finishOnboarding()" class="text-xs font-semibold text-slate-400 hover:text-white">Skip</button>
    </div>

    <div class="text-center space-y-6 my-auto">
      <div class="w-24 h-24 rounded-full bg-orange-500/15 border border-orange-500/30 mx-auto flex items-center justify-center text-4xl text-orange-400">
        📦
      </div>
      <div class="space-y-2.5">
        <h1 class="text-2xl font-extrabold text-white tracking-tight">Send Packages Instantly</h1>
        <p class="text-xs text-slate-400 leading-relaxed max-w-xs mx-auto">
          Book a delivery in seconds. Just set your pickup and drop-off and we'll match you with a rider nearby.
        </p>
      </div>
    </div>

    <div class="space-y-6">
      <div class="flex items-center justify-center gap-2">
        <span class="w-6 h-1.5 rounded-full bg-orange-500"></span>
        <span class="w-2 h-1.5 rounded-full bg-slate-700"></span>
        <span class="w-2 h-1.5 rounded-full bg-slate-700"></span>
      </div>
      <button type="button" onclick="finishOnboarding()" class="w-full bg-orange-600 hover:bg-orange-500 py-3.5 rounded-2xl text-sm font-bold text-white shadow-lg">
        Get Started
      </button>
    </div>
  </div>

  <!-- ==================== 2. CUSTOMER AUTH ==================== -->
  <div id="cust-auth-screen" class="hidden min-h-screen bg-gradient-to-b from-slate-900 via-slate-950 to-slate-950 flex flex-col justify-center px-6 py-8 max-w-md mx-auto">
    <div class="mb-6">
      <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-orange-500/15 border border-orange-500/30 mb-3">
        <span class="w-2 h-2 rounded-full bg-orange-500"></span>
        <span class="text-[11px] font-bold text-orange-400">SPEEDIAL EXPRESS • RC: 8937370</span>
      </div>
      <h1 id="c-auth-title" class="text-3xl font-extrabold text-white">Welcome Back</h1>
      <p class="text-xs text-slate-400 mt-1">Login to continue or book as a guest</p>
    </div>

    <div id="c-auth-form" class="space-y-3">
      <div id="c-reg-name-wrap" class="hidden space-y-1">
        <label class="text-[11px] font-semibold text-slate-400">Full Name</label>
        <input id="c-name" type="text" placeholder="Enter your full name" class="w-full bg-slate-900 border border-slate-700 rounded-2xl px-4 py-3 text-sm text-white" />
      </div>
      <div class="space-y-1">
        <label id="c-phone-label" class="text-[11px] font-semibold text-slate-400">Phone Number</label>
        <input id="c-phone" type="text" placeholder="e.g 08166317937" class="w-full bg-slate-900 border border-slate-700 rounded-2xl px-4 py-3 text-sm text-white" />
      </div>
      <div class="space-y-1">
        <label class="text-[11px] font-semibold text-slate-400">4-Digit PIN</label>
        <input id="c-pin" type="password" maxlength="4" inputmode="numeric" placeholder="••••" class="w-full bg-slate-900 border border-slate-700 rounded-2xl px-4 py-3 text-sm text-white font-mono tracking-widest" />
      </div>

      <button type="button" onclick="submitCustomerAuth()" class="w-full bg-orange-600 hover:bg-orange-500 py-3.5 rounded-2xl text-sm font-bold text-white shadow-lg mt-2">
        Login
      </button>
      <p id="c-auth-msg" class="text-xs text-center hidden"></p>

      <div class="flex items-center justify-between text-xs pt-3">
        <button type="button" onclick="switchCustomerAuthMode()" id="c-switch-btn" class="text-orange-400 font-bold hover:underline">
          Don't have an account? Sign
